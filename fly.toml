app = "dialogue-duel"
primary_region = "bom"

[build]

[env]
  PORT = "3000"
  DATA_DIR = "/data"
  TRUST_PROXY = "1"
  AUTH_METHODS = "email"

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1

  [[http_service.checks]]
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
